server:
  port: 0

spring:
  application:
    name: pairion-server-test
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  datasource:
    url: jdbc:sqlite::memory:?cache=shared
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false

pairion:
  stt:
    native:
      enabled: false
  adapters:
    embedding:
      baseUrl: http://localhost:11434/v1
      model: nomic-embed-text
      enabled: false
  data:
    adsb:
      opensky-username: test-user
      opensky-password: test-pass
