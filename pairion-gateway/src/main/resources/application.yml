server:
  port: 18789
  tomcat:
    websocket:
      max-binary-message-buffer-size: 1048576
      max-text-message-buffer-size: 262144

spring:
  threads:
    virtual:
      enabled: true

pairion:
  adapters:
    # ── LLM adapter selection ────────────────────────────────────────────────
    # openaicompat: local LM Studio / Ollama / any OpenAI-compatible backend
    # anthropic:    Anthropic Claude via official Java SDK (requires ANTHROPIC_API_KEY)
    # Default when this key is absent: anthropic
    llm: openaicompat

    # ── OpenAI-compatible adapter (active when llm=openaicompat) ────────────
    openaicompat:
      baseUrl: http://localhost:1234/v1   # LM Studio default port
      model: glm-4.7-flash                # model id from GET /v1/models
      apiKey:                             # blank — LM Studio requires no API key

    # ── Anthropic adapter (restore by setting llm=anthropic above) ──────────
    # Requires ANTHROPIC_API_KEY environment variable.
    # anthropic:
    #   model: claude-sonnet-4-6

    tts:
      piper:
        voice: en_GB-alan-medium

logging:
  level:
    root: INFO
    com.pairion: DEBUG
  file:
    name: ${user.home}/Pairion/logs/pairion.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      file-name-pattern: ${user.home}/Pairion/logs/pairion-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 7