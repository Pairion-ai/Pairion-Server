server:
  port: 18789
  tomcat:
    websocket:
      max-binary-message-buffer-size: 1048576
      max-text-message-buffer-size: 262144

spring:
  threads:
    virtual:
      enabled: true

pairion:
  adapters:
    # LLM adapter selection: anthropic (default) | openaicompat
    # llm: openaicompat
    # OpenAI-compatible adapter — uncomment and configure when pairion.adapters.llm=openaicompat
    # llm:
    #   openaicompat:
    #     baseUrl: http://localhost:1234/v1   # LM Studio / Ollama / OpenAI / etc.
    #     model: gpt-4o-mini                 # model identifier
    #     apiKey:                            # leave blank for local deployments
    tts:
      piper:
        voice: en_GB-alan-medium

logging:
  level:
    root: INFO
    com.pairion: DEBUG
  file:
    name: ${user.home}/Pairion/logs/pairion.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      file-name-pattern: ${user.home}/Pairion/logs/pairion-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 7