server:
  port: 18789
  tomcat:
    websocket:
      max-binary-message-buffer-size: 1048576
      max-text-message-buffer-size: 262144

spring:
  threads:
    virtual:
      enabled: true

pairion:
  adapters:
    # ── LLM adapter selection ────────────────────────────────────────────────
    # openaicompat: local LM Studio / Ollama / any OpenAI-compatible backend
    # anthropic:    Anthropic Claude via official Java SDK (requires ANTHROPIC_API_KEY)
    # Default when this key is absent: anthropic
    llm: openaicompat

    # ── OpenAI-compatible adapter (active when llm=openaicompat) ────────────
    openaicompat:
      baseUrl: http://localhost:1234/v1   # LM Studio default port
      model: qwen2.5-14b-instruct-mlx      # model id from GET /v1/models
      apiKey:                             # blank — LM Studio requires no API key
      connectTimeoutSeconds: 10           # TCP connection timeout
      requestTimeoutSeconds: 30           # seconds to wait for response headers (catches model-loading hangs)

    # ── Anthropic adapter (active when llm=anthropic) ───────────────────────
    # Requires ANTHROPIC_API_KEY environment variable.
    # Model defaults to claude-sonnet-4-6 (see AnthropicLlmAdapter @Value default).

    tts:
      piper:
        voice: en_GB-alan-medium
        length-scale: 0.85

  data:
    adsb:
      # Geographic bounding box for ADS-B state queries (continental US defaults)
      lamin: 24.0      # southern boundary (latitude min, decimal degrees)
      lomin: -125.0    # western boundary (longitude min, decimal degrees)
      lamax: 49.0      # northern boundary (latitude max, decimal degrees)
      lomax: -66.0     # eastern boundary (longitude max, decimal degrees)
      poll-interval-seconds: 10
      # OpenSky Network credentials (HTTP Basic Auth — increases rate limits)
      opensky-username: aallard
      opensky-password: Annabelle01*

logging:
  level:
    root: INFO
    com.pairion: DEBUG
  file:
    name: ${user.home}/Pairion/logs/pairion.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      file-name-pattern: ${user.home}/Pairion/logs/pairion-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 7