server:
  port: 18789
  tomcat:
    websocket:
      max-binary-message-buffer-size: 1048576
      max-text-message-buffer-size: 262144

logging:
  level:
    root: INFO
    com.pairion: DEBUG
  file:
    name: ${user.home}/Pairion/logs/pairion.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      file-name-pattern: ${user.home}/Pairion/logs/pairion-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 7