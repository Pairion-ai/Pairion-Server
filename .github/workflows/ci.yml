name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, Lint, Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Contract tests
        run: pnpm test:contract

      - name: Cross-user leak suite
        run: pnpm test:leak

      - name: Benchmarks
        run: pnpm test:bench

      - name: Coverage check
        run: pnpm coverage:check

      - name: Schema lint
        run: pnpm schema:lint
